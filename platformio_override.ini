; Custom build: WLED (esp32dev) + weather/tide dashboard + cylinder grid usermods
[platformio]
default_envs = esp32dev_wt

[env:esp32dev_wt]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags}
  -D USERMOD_WEATHER_TIDE
  -D USERMOD_CYLINDER_GRID
lib_deps = ${env:esp32dev.lib_deps}
  WiFiClientSecure
